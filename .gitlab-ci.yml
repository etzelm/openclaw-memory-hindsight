# Package CI: install, typecheck + build (tsc -> dist/), vitest with coverage floor, oxlint,
# oxfmt check, pack guard (same script as GitHub CI and release), and the compat script tests.

stages:
  - check

variables:
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  image: node:24-alpine
  tags:
    - claw
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

check:
  stage: check
  script:
    - apk add --no-cache bash
    - node --version && npm --version
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
    - npm run test:coverage
    - npm run lint
    - npm run format:check
    - node --test scripts/pack-guard.test.mjs scripts/api-contract.test.mjs
    - bash scripts/host-types.sh --self-test
    # The published file list must never carry tests, helpers or local state, and must carry
    # every file a release needs.
    - npm pack --dry-run --json --ignore-scripts > pack.json
    - node -e 'console.log(require("./pack.json")[0].files.map((x)=>x.path).join("\n"))'
    - node scripts/pack-guard.mjs pack.json
  # MR widget percentage comes from the text-summary Lines row.
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Shell tests for the compat nightly and matrix scripts (not in the package). They need bash, git
# and python3, and must run as a non-root user: one case checks an unwritable WORK_ROOT, which root
# can still write.
scripts:
  stage: check
  cache: []
  script:
    - apk add --no-cache bash git python3
    - chown -R node:node "$CI_PROJECT_DIR"
    - su node -s /bin/sh -c 'bash -n scripts/*.sh && bash scripts/compat-nightly.test.sh && bash scripts/compat-matrix.sh --self-test && bash scripts/recall-ab.test.sh'

# The plugin against the latest OpenClaw release (the check job covers the floor host, the
# devDependency). Installs openclaw@latest into a scratch dir; scripts/host-types.sh.
host-latest:
  stage: check
  script:
    - apk add --no-cache bash
    - npm ci --no-audit --no-fund
    - bash scripts/host-types.sh --host latest --tests
