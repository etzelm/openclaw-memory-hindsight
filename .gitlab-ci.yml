# Package CI: install, typecheck + build (tsc -> dist/), vitest with coverage floor, oxlint,
# oxfmt check, pack guard (same script as GitHub CI and release), and the compat script tests.

stages:
  - check

variables:
  GIT_DEPTH: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  image: node:24-alpine
  tags:
    - claw
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

check:
  stage: check
  script:
    - apk add --no-cache bash
    - node --version && npm --version
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
    - npm run test:coverage
    - npm run lint
    - npm run format:check
    - node --test scripts/pack-guard.test.mjs scripts/api-contract.test.mjs scripts/sidecar-variant.test.mjs
    - bash scripts/host-types.sh --self-test
    # The published file list must never carry tests, helpers or local state, and must carry
    # every file a release needs.
    - npm pack --dry-run --json --ignore-scripts > pack.json
    - node -e 'console.log(require("./pack.json")[0].files.map((x)=>x.path).join("\n"))'
    - node scripts/pack-guard.mjs pack.json
  # MR widget percentage comes from the text-summary Lines row.
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Shell tests for the compat nightly and matrix scripts (not in the package). They need bash, git
# and python3, and must run as a non-root user: one case checks an unwritable WORK_ROOT, which root
# can still write.
scripts:
  stage: check
  cache: []
  script:
    - apk add --no-cache bash git python3
    - chown -R node:node "$CI_PROJECT_DIR"
    - su node -s /bin/sh -c 'bash -n scripts/*.sh && bash scripts/compat-nightly.test.sh && bash scripts/compat-matrix.sh --self-test && bash scripts/recall-ab.test.sh'

# The plugin against the latest OpenClaw release (the check job covers the floor host, the
# devDependency). Installs openclaw@latest into a scratch dir; scripts/host-types.sh.
host-latest:
  stage: check
  script:
    - apk add --no-cache bash
    - npm ci --no-audit --no-fund
    - bash scripts/host-types.sh --host latest --tests

# The plugin on a dev OpenClaw host with api.metrics (openclaw#198455; in no npm release yet, and
# the released packages ship no diagnostics-prometheus exporter): boots an isolated Gateway with
# allowMetrics true and asserts the scrape has the hindsight families and the queue depth
# heartbeat (scripts/dev-host-scrape.sh). The host build needs about 4.7 GB and this runner's
# containers get about 2.1 GB of heap, so the host is built once elsewhere (the Studio) with
# scripts/dev-host-pack.sh and kept in this project's generic package registry; the job checks
# its sha256 and only runs pnpm install. To move the host: build, pack, upload, update both vars.
dev-host:
  stage: check
  image: node:24-bookworm
  timeout: 30m
  variables:
    # Upstream main with #198455 (merge bd1c54cf); the commit the mini's dev host runs.
    OPENCLAW_DEV_SHA: d7d546f292779a618e6749a4550f3752bab13850
    OPENCLAW_DEV_TGZ_SHA256: 63293be468dd9c6bd50bcb79ed85e16f7dd62b877135945842f8df41ec71f32e
  script:
    - npm ci --no-audit --no-fund
    - npm run build
    - >-
      bash scripts/dev-host-scrape.sh
      --prebuilt "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/openclaw-dev-host/$OPENCLAW_DEV_SHA/openclaw-dev-host-${OPENCLAW_DEV_SHA:0:11}.tgz"
      --sha256 "$OPENCLAW_DEV_TGZ_SHA256" --work "$CI_PROJECT_DIR/.dev-host" --out dev-host-out
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dev-host-out/
